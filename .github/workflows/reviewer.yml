name: reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 仅授予必要权限: 读代码, 写 PR 评论
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Review
    runs-on: ubuntu-latest
    # 跳过 fork 发起的 PR: public 库不向 fork 注入 secrets, 无 key 时直接跳过
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MiniMax M3 Review
        uses: anthropics/claude-code-action@v1
        env:
          # 复用 Claude Code CLI 的 Anthropic 兼容协议, 将其整体指向 MiniMax M3
          ANTHROPIC_BASE_URL: https://api.minimaxi.com/anthropic
          ANTHROPIC_MODEL: MiniMax-M3
        with:
          # 显式用内置 GITHUB_TOKEN 发评论, 避免走官方 Claude Code App (未安装且不匹配 MiniMax)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.MINIMAX_API_KEY }}
          prompt: |
            请以中文 review 本 PR 的代码改动, 使用半角标点.
            本项目规范以仓库根目录 AGENTS.md 与 docs/ 为权威来源, review 时须依次对照:
            - 提交与分支: 提交信息遵循 Conventional Commits 且描述用中文; 分支命名为 title/scope/description-author-MMDD; 不直接提交 main, 同步主分支优先 rebase.
            - 目录约定: 按页聚合, 通用内容放 src 顶层对应目录 (components / hooks / utils 等), 页面专用内容放该页目录; 页面即路由文件夹不可嵌套, 新增页面须注册到 app.config.ts.
            - 状态管理: Context 只放基本状态与 setter, 复杂逻辑下沉对应 Hook; Provider 的 value 用 useMemo 稳定, 消费用 useXxxContext 并做未挂载兜底; 用到原值的 setState 须函数式更新.
            - 样式方案: 遵循原子类 (cn 拼接) > 内联 style > SCSS 兜底的分层优先级, 勿硬编码主题色, 需要伪元素时用真实 DOM 承载.
            - 代码风格: 双引号, 2 空格缩进, 无分号; 禁止 console.log, 用 logger; 公共类型 / 函数 / Hook 写 JSDoc.
            以上仅为要点, 具体细则以 AGENTS.md 为准.
            只指出实质问题 (bug, 规范冲突, 可维护性), 不啰嗦, 不复述改动.
