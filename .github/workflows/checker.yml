name: checker

on:
  # 仅 main 的 push (即 PR 合并) 跑一次, 验证合并 commit
  # 功能分支的验证由 pull_request 覆盖, 避免重复
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
